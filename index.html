<script>
function processSales(data) {
    const date = getISTDate();
    const h1 = data[0] || [], h2 = data[1] || [];
    if (!h1.length || !h2.length) return;

    const clean = v => {
        if (v === undefined || v === null) return "";
        const text = String(v).replace(/\s+/g, " ").trim();
        return text.toLowerCase() === "nan" ? "" : text;
    };
    const key = v => clean(v).toLowerCase().replace(/[^a-z0-9%]+/g, " ").replace(/\s+/g, " ").trim();
    const compact = v => key(v).replace(/\s+/g, "");
    const hasWord = (k, w) => new RegExp(`(^|\\s)${w}(\\s|$)`).test(k);

    const cols = [];
    for (let i = 0; i < Math.max(h1.length, h2.length); i++) {
        const top = clean(h1[i]);
        const label = clean(h2[i]);
        const direct = label || top;
        const combined = [top, label].filter(Boolean).join(" ").trim();
        cols.push({
            index: i,
            name: combined || direct || `Column ${i + 1}`,
            directKey: key(direct),
            directCompact: compact(direct),
            combinedKey: key(combined)
        });
    }

    const isHsn = c => hasWord(c.directKey, "hsn") || hasWord(c.directKey, "sac") || c.directCompact.includes("hsnsac");
    const isGst = c => !isHsn(c) && (hasWord(c.directKey, "gst") || c.directCompact === "gst" || c.directCompact === "gst%");
    const isProduct = c => (hasWord(c.directKey, "system") && hasWord(c.directKey, "name")) || hasWord(c.directKey, "product") || hasWord(c.directKey, "item") || hasWord(c.directKey, "description");
    const isBilling = c => hasWord(c.directKey, "billing") || hasWord(c.directKey, "bill") || c.directCompact.includes("billingprice");
    const isTotal = c => hasWord(c.directKey, "total") || hasWord(c.combinedKey, "total");
    const isSerial = c => c.directKey === "sl" || c.directCompact === "sno" || c.directCompact === "slno" || hasWord(c.directKey, "serial");
    const isDescriptor = c => ["name", "code", "date", "rate", "price", "mrp", "remark", "remarks", "note"].some(w => hasWord(c.directKey, w));

    const findCol = fn => {
        const found = cols.find(fn);
        return found ? found.index : -1;
    };

    const plainNum = v => {
        if (typeof v === "number") return Number.isFinite(v) ? v : NaN;
        if (v === undefined || v === null) return NaN;
        const text = String(v).trim().replace(/,/g, "");
        if (!/^[-+]?\d*\.?\d+%?$/.test(text)) return NaN;
        return parseFloat(text);
    };

    const hasQty = idx => {
        for (let r = 2; r < data.length; r++) {
            const v = data[r] ? data[r][idx] : "";
            if (v !== "" && v !== undefined && v !== null && !isNaN(plainNum(v))) return true;
        }
        return false;
    };

    const pIdx = findCol(isProduct);
    const gIdx = findCol(isGst);
    const bIdx = findCol(isBilling);
    const hsnIdx = findCol(isHsn);
    const totalIdx = findCol(isTotal);
    const serialIdx = findCol(isSerial);

    const missing = [];
    if (pIdx === -1) missing.push("System/Product");
    if (gIdx === -1) missing.push("GST %");
    if (bIdx === -1) missing.push("Billing Price");
    if (missing.length) {
        document.getElementById("sales-status").innerText = `Error: Missing column(s): ${missing.join(", ")}`;
        return;
    }

    const known = new Set([pIdx, gIdx, bIdx, hsnIdx, totalIdx, serialIdx].filter(i => i !== -1));
    const rightLimit = totalIdx === -1 ? cols.length : totalIdx;
    const stores = cols
        .filter(c => c.index > bIdx && c.index < rightLimit)
        .filter(c => !known.has(c.index) && !isDescriptor(c) && c.name && hasQty(c.index))
        .map(c => ({ n: c.name, id: c.index }));

    if (!stores.length) {
        document.getElementById("sales-status").innerText = "Error: Store quantity columns not found";
        return;
    }

    salesData = [["SL", "voucher no", "voucher date", "Party name", "Product", "Qty", "GST %", "Rate per Qty excl.GST", "Cgst", "SGST", "IGST", "Total"]];

    const localKeywords = [
        "chikmagalur", "frazer town", "hal", "hesaraghatta", "hoskote",
        "jeevan bima nagar", "kammanahalli", "kannamangala", "kempapura",
        "k r puram", "nelamangala", "new bel road", "sahakaranagar",
        "t c palya", "kalyan nagar", "vidyaranyapura"
    ];

    stores.forEach((s, sIdx) => {
        for (let r = 2; r < data.length; r++) {
            if (!data[r][pIdx]) continue;
            let q = parseNum(data[r][s.id]);
            if (q > 0) {
                let gRaw = parseNum(data[r][gIdx]);
                let g = Math.round(gRaw < 1 ? gRaw * 100 : gRaw);
                let billRate = parseNum(data[r][bIdx]);
                let rate = parseFloat((billRate / (1 + (g / 100))).toFixed(2));
                let taxable = rate * q;
                let isLocal = localKeywords.some(kw => fuzzyMatch(s.n, kw));
                let tax = taxable * (g / 100);
                let c = isLocal ? parseFloat((tax / 2).toFixed(2)) : 0;
                let st = isLocal ? parseFloat((tax / 2).toFixed(2)) : 0;
                let ig = isLocal ? 0 : parseFloat(tax.toFixed(2));

                salesData.push([salesData.length, sIdx + 1, date, s.n, data[r][pIdx], q, g, rate, c, st, ig, parseFloat((taxable + c + st + ig).toFixed(2))]);
            }
        }
    });

    document.getElementById("sales-status").innerText = `✓ Sales Processed Store-Wise (Date: ${date})`;
    document.getElementById("sales-dl").style.display = "block";
}
</script>
